<meta name="theme-color" content="#0B0B0B"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | GoldBuilders Co.</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="admin-shell"><div style="min-height:100vh;display:grid;place-items:center;padding:25px"><div class="form-card" style="width:min(440px,100%)"><div class="admin-brand-lockup" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;color:#D4AF37;font-family:Playfair Display,serif;font-size:1.5rem"><img src="../assets/images/goldbuilders-gb-emblem.png?v=20261031-brandfix2" alt="" aria-hidden="true" style="display:block;width:52px;height:44px;object-fit:contain"><span>GoldBuilders Co.</span></div><div class="eyebrow">Secure Access</div><h1 class="section-title" style="font-size:2.5rem">Database &amp; Admin Login</h1><p class="muted" style="margin-bottom:24px">Authorized GoldBuilders team members only.</p><div id="msg" class="error"></div><form id="login"><div class="field" style="margin-bottom:16px"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-bottom:16px"><label>Password</label><input id="password" type="password" required></div><button class="btn" style="width:100%" type="submit">Sign In</button></form><p class="small" style="margin-top:16px">Credentials are configured securely on the server via environment variables during first-time setup.</p></div></div><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok)location.href='/admin/dashboard.html';else{msg.textContent=d.error||'Login failed';msg.style.display='block'}});
</script></body></html>
